<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <!--
    PayPal Checkout Integrator · Chui Labs: background doodle tile (repeats seamlessly).
    Edit freely in Canva, Illustrator, or Figma. Keep it 360 x 360 and keep shapes
    inside the edges so the tile still repeats. Save over this file to update the site.
  -->
  <g fill="none" stroke="#1b2a5e" stroke-opacity="0.11" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- cart -->
    <g transform="translate(26 24) rotate(-12 14 14) scale(1.2)"><path d="M3 4h2l2.4 11h10.2L20 8H6.4 M9 20h.01 M17 20h.01"/></g>
    <!-- card -->
    <g transform="translate(120 34) rotate(8 14 14) scale(1.2)"><path d="M3 6h18v12H3z M3 10h18 M7 15h4"/></g>
    <!-- coin -->
    <g transform="translate(214 18) rotate(-6 14 14) scale(1.2)"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Z M14.5 8.5c-.6-.8-1.5-1.2-2.5-1.2-1.5 0-2.6.8-2.6 2s1.1 1.7 2.6 2 2.6.9 2.6 2.1-1.1 2-2.6 2c-1.1 0-2-.5-2.6-1.3 M12 6v1.3 M12 16.7V18"/></g>
    <!-- receipt -->
    <g transform="translate(300 40) rotate(10 14 14) scale(1.2)"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z M9 8h6 M9 12h6"/></g>
    <!-- shield check -->
    <g transform="translate(64 112) rotate(6 14 14) scale(1.2)"><path d="M12 3 5 6v6c0 4 3 7 7 9 4-2 7-5 7-9V6l-7-3Z M9.5 12.5l2 2 3.5-4"/></g>
    <!-- bag -->
    <g transform="translate(166 120) rotate(-8 14 14) scale(1.2)"><path d="M6 7h12l-1 13H7L6 7Z M9 7a3 3 0 0 1 6 0"/></g>
    <!-- price tag -->
    <g transform="translate(262 108) rotate(14 14 14) scale(1.2)"><path d="M3 12V4h8l10 10-8 8L3 12Z M7.5 8.5h.01"/></g>
    <!-- package -->
    <g transform="translate(22 206) rotate(-4 14 14) scale(1.2)"><path d="M3 7l9-4 9 4v10l-9 4-9-4V7Z M3 7l9 4 9-4 M12 11v10"/></g>
    <!-- refund arrows -->
    <g transform="translate(118 214) rotate(10 14 14) scale(1.2)"><path d="M4 9a8 8 0 0 1 14-3l2 2 M20 4v4h-4 M20 15a8 8 0 0 1-14 3l-2-2 M4 20v-4h4"/></g>
    <!-- check circle -->
    <g transform="translate(214 200) rotate(0 14 14) scale(1.2)"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Z M8 12.5l2.8 2.8L16 9.8"/></g>
    <!-- lock -->
    <g transform="translate(306 214) rotate(-10 14 14) scale(1.2)"><path d="M6 11h12v9H6z M8.5 11V8a3.5 3.5 0 0 1 7 0v3"/></g>
    <!-- heart -->
    <g transform="translate(70 296) rotate(-10 14 14) scale(1.2)"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10Z"/></g>
    <!-- sparkle -->
    <g transform="translate(176 292) rotate(12 14 14) scale(1.2)"><path d="M12 3v4 M12 17v4 M3 12h4 M17 12h4 M6 6l2.5 2.5 M15.5 15.5 18 18 M6 18l2.5-2.5 M15.5 8.5 18 6"/></g>
    <!-- card 2 -->
    <g transform="translate(274 300) rotate(-14 14 14) scale(1.2)"><path d="M3 6h18v12H3z M3 10h18 M7 15h4"/></g>
    <!-- small plus signs -->
    <path d="M100 86v8 M96 90h8 M246 82v8 M242 86h8 M86 192v8 M82 196h8 M282 176v8 M278 180h8 M138 340v8 M134 344h8 M240 344v8 M236 348h8"/>
  </g>
  <!-- colour accents: Chui navy and teal, kept faint -->
  <g>
    <circle cx="190" cy="78" r="3.5" fill="#516db1" fill-opacity="0.3"/>
    <circle cx="28" cy="150" r="3" fill="#0b7285" fill-opacity="0.22"/>
    <circle cx="338" cy="148" r="4" fill="#516db1" fill-opacity="0.28"/>
    <circle cx="176" cy="180" r="2.5" fill="#1b2a5e" fill-opacity="0.15"/>
    <circle cx="60" cy="266" r="3.5" fill="#516db1" fill-opacity="0.28"/>
    <circle cx="266" cy="262" r="3" fill="#0b7285" fill-opacity="0.22"/>
    <circle cx="330" cy="340" r="2.5" fill="#1b2a5e" fill-opacity="0.15"/>
    <circle cx="20" cy="340" r="3" fill="#0b7285" fill-opacity="0.2"/>
  </g>
</svg>
